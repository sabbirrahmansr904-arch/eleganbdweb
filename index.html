<!DOCTYPE html>

    <meta charset="UTF-8" />
    <script>
      (function() {
        function isQuotaOrFirestoreAssertion(err) {
          if (!err) return false;
          var str = '';
          try {
            if (typeof err === 'string') str = err;
            else if (err && err.message) str = err.message + ' ' + (err.stack || '') + ' ' + (err.code || '');
            else str = JSON.stringify(err) + ' ' + String(err);
          } catch(e) { str = String(err); }
          var lower = str.toLowerCase();
          return lower.indexOf('quota') !== -1 ||
                 lower.indexOf('resource_exhausted') !== -1 ||
                 lower.indexOf('resource-exhausted') !== -1 ||
                 lower.indexOf('free daily read units') !== -1 ||
                 lower.indexOf('free tier database') !== -1 ||
                 lower.indexOf('internal assertion failed') !== -1 ||
                 lower.indexOf('unexpected state') !== -1 ||
                 lower.indexOf('ca9') !== -1 ||
                 lower.indexOf('b815') !== -1 ||
                 lower.indexOf('firestore') !== -1 && lower.indexOf('assertion') !== -1;
        }

        var origErr = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            try { return (a && a.message) ? a.message + ' ' + (a.stack || '') : String(a); } catch(e) { return ''; }
          }).join(' ');
          if (isQuotaOrFirestoreAssertion(joined)) return;
          origErr.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (isQuotaOrFirestoreAssertion(e.error || e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            e.stopPropagation && e.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isQuotaOrFirestoreAssertion(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            e.stopPropagation && e.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
