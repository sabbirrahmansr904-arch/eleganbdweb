    <script>
      (function() {
        function isQuotaError(err) {
          if (!err) return false;
          var str = '';
          try {
            if (typeof err === 'string') str = err;
            else if (err && err.message) str = err.message + ' ' + (err.stack || '') + ' ' + (err.code || '');
            else str = JSON.stringify(err) + ' ' + String(err);
          } catch(e) { str = String(err); }
          var lower = str.toLowerCase();
          return lower.indexOf('quota limit exceeded') !== -1 ||
                 lower.indexOf('resource-exhausted') !== -1 ||
                 lower.indexOf('resource_exhausted') !== -1;
        }

        var origErr = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            try { return (a && a.message) ? a.message + ' ' + (a.stack || '') : String(a); } catch(e) { return ''; }
          }).join(' ');
          if (isQuotaError(joined)) return;
          origErr.apply(console, args);
        };
      })();
    </script>

    <script>
      // Instantly unregister all stale service workers and purge all old caches on all hosts
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var j = 0; j < names.length; j++) {
            caches.delete(names[j]);
          }
        });
      }
